<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/libs/gsap/gsap.min.js" defer></script>
    <script src="/libs/gsap/ScrollSmoother.min.js" defer></script>
    <script src="/libs/gsap/ScrollTrigger.min.js" defer></script>
    <link rel="stylesheet" href="/css/style.css">
    <title>Космос</title>
</head>
<body>
    <div class="wrapper">
        <div class="content">
            <header class="main-header">
                <div class="layers">
					<div class="layer__header">
						<div class="layers__caption">Что такое вселенная?</div>
						<div class="layers__title">Откуда началось наше путешествие?</div>
					</div>
					<div class="layer layers__base" style="background-image: url(img/звезды1.png);"></div>
					<div class="layer layers__middle" style="background-image: url(img/звезды2.png);"></div>
					<div class="layer layers__front" style="background-image: url(img/звезды3.png);"></div>
                    <img src="/img/arrow.png" alt="arrow">
				</div>

            </header>
            <article class="content__container">
                <div class="text__block"></div>
                <img src="/img/planet.png" alt="planet" class="planet">
            </article>
        </div>
    </div>
    <script src="/js/main.js"></script>
</body>
</html>
